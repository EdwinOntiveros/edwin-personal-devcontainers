failure-threshold: warning

ignored:
  # ignore using latest tag instead of sha digest
  - DL3007
  # encourage pin apt package versions as a warning, debian package updates preferred
  - DL3008
  # USER_GID derives from USER_UID and contains no sensitive data.
  - DL3064

override:
  warning:
    # encourage --no-install-recommends
    - DL3015
