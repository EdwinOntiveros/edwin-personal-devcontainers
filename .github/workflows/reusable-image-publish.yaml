name: Reusable Image Publish

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name"
        type: string
        required: true

      image_tag:
        description: "Immutable source image tag"
        type: string
        required: true

      channel:
        description: "Release channel"
        type: string
        required: true

      registry:
        description: "Container registry"
        type: string
        required: false
        default: ghcr.io

      repository_owner:
        description: "Container registry owner"
        type: string
        required: false
        default: edwinontiveros

    outputs:
      image_reference:
        description: "Published image reference"
        value: ${{ jobs.publish.outputs.image_reference }}

      image_digest:
        description: "Published image digest"
        value: ${{ jobs.publish.outputs.image_digest }}

jobs:
  publish:
    name: Publish ${{ inputs.image_name }}:${{ inputs.channel }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_reference: ${{ steps.digest.outputs.image_reference }}
      image_digest: ${{ steps.digest.outputs.image_digest }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

