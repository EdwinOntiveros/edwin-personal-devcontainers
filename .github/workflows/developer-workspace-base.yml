name: Developer Workspace Base

on:
    push:
        branches:
            - mainline
        paths:
            - "images/**"
            - "tests/**"
            - ".github/workflows/developer-workspace-base.yml"

    pull_request:
        branches:
            - mainline
        paths:
            - "images/**"
            - "tests/**"
            - ".github/workflows/developer-workspace-base.yml"

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE: developer-workspace-base
    IMAGE_NAME: ${{ github.repository_owner }}/developer-workspace-base

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Lint Markdown
              continue-on-error: true
              uses: DavidAnson/markdownlint-cli2-action@v20

            - name: Lint Dockerfile
              uses: hadolint/hadolint-action@v3.3.0
              with:
                  dockerfile: images/${{ env.IMAGE }}/Dockerfile
                  config: .github/hadolint.yaml

            - name: Lint Shell Scripts
              uses: ludeeus/action-shellcheck@master
              with:
                  scandir: tests
                  severity: warning
                  check_together: "yes"

    build-and-test:
        needs: lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract OCI metadata
              id: image_meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  labels: |
                      org.opencontainers.image.title=Developer Workspace Base
                      org.opencontainers.image.description=Reusable Debian-based development workspace base image
                      org.opencontainers.image.vendor=Edwin Ontiveros
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}

            - name: Build Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: images/${{ env.IMAGE }}/Dockerfile
                  load: true
                  push: false
                  tags: ${{ env.IMAGE }}:test
                  labels: ${{ steps.image_meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Verify Workspace
              run: |
                  git rev-parse HEAD
                  find tests -type f | sort

            - name: Run Smoke Tests
              run: |
                  chmod +x tests/images/${{ env.IMAGE }}/smoke.sh

                  docker run --rm \
                    -v "${{ github.workspace }}/tests:/tests:ro" \
                    ${{ env.IMAGE }}:test \
                    bash /tests/images/${{ env.IMAGE }}/smoke.sh

            - name: Export Tested Image
              run: |
                  docker save \
                    ${{ env.IMAGE }}:test \
                    | gzip > /tmp/${{ env.IMAGE }}.tar.gz

            - name: Verify Exported Image
              run: |
                  docker image inspect ${{ env.IMAGE }}:test
                  test -f /tmp/${{ env.IMAGE }}.tar.gz
                  gzip -t /tmp/${{ env.IMAGE }}.tar.gz

            - name: Upload Tested Image Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: tested-${{ env.IMAGE }}
                  path: /tmp/${{ env.IMAGE }}.tar.gz
                  retention-days: 1

    publish:
        if: github.event_name == 'push' && github.ref == 'refs/heads/mainline'
        needs: build-and-test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5

            - name: Download Tested Image Artifact
              uses: actions/download-artifact@v4
              with:
                  name: tested-${{ env.IMAGE }}
                  path: /tmp

            - name: Load Tested Image
              run: |
                  gunzip -c /tmp/${{ env.IMAGE }}.tar.gz | docker load

            - name: Verify Loaded Image
              run: |
                  docker image inspect ${{ env.IMAGE }}:test

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tag Tested Image
              run: |
                  docker tag \
                    ${{ env.IMAGE }}:test \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

                  docker tag \
                    ${{ env.IMAGE }}:test \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable

                  docker tag \
                    ${{ env.IMAGE }}:test \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            - name: Publish Release Image
              run: |
                  docker push \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                  docker push \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable
                  docker push \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            - name: Verify Published Image
              run: |
                  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable
                  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

                  docker inspect \
                    --format='{{index .RepoDigests 0}}' \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable

            - name: Post-publish Validation
              run: |
                  docker run --rm \
                   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable \
                   bash --version
