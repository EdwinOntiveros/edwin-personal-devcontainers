name: Developer Workspace Base

on:
    push:
        branches:
            - mainline
        paths:
            - "images/**"
            - "tests/**"
            - ".github/workflows/developer-workspace-base.yml"

    pull_request:
        branches:
            - mainline
        paths:
            - "images/**"
            - "tests/**"
            - ".github/workflows/developer-workspace-base.yml"

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE: developer-workspace-base
    IMAGE_NAME: ${{ github.repository_owner }}/developer-workspace-base

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Lint Markdown
              continue-on-error: true
              uses: DavidAnson/markdownlint-cli2-action@v20

            - name: Lint Dockerfile
              uses: hadolint/hadolint-action@v3.3.0
              with:
                  dockerfile: images/${{ env.IMAGE }}/Dockerfile
                  config: .github/hadolint.yaml

            - name: Lint Shell Scripts
              uses: ludeeus/action-shellcheck@master
              with:
                  scandir: tests
                  severity: warning
                  check_together: "yes"

    build:
        needs: lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              if: github.event_name == 'push'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract OCI metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha
                      type=ref,event=branch

                  labels: |
                      org.opencontainers.image.title=Developer Workspace Base
                      org.opencontainers.image.vendor=Edwin Ontiveros
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}

            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: images/${{ env.IMAGE }}/Dockerfile

                  load: true
                  push: false

                  tags: ${{ env.IMAGE }}:test

                  cache-from: type=gha
                  cache-to: type=gha,mode=max

                  labels: ${{ steps.meta.outputs.labels }}

            - name: Verify Workspace
              run: |
                  git rev-parse HEAD
                  find tests -type f | sort

            - name: Run smoke tests
              run: |
                  chmod +x tests/images/${{ env.IMAGE }}/smoke.sh

                  docker run --rm \
                    -v "${{ github.workspace }}/tests:/tests:ro" \
                    ${{ env.IMAGE }}:test \
                    bash /tests/images/${{ env.IMAGE }}/smoke.sh

            - name: Publish image to GHCR
              if: github.event_name == 'push'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: images/${{ env.IMAGE }}/Dockerfile

                  push: true

                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

                  cache-from: type=gha
                  cache-to: type=gha,mode=max
